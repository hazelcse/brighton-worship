[project]
name = "worship-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hazel", email = "noreply@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fonttools>=4.68.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "lxml>=6.1.3",
    "ortools>=9.15.6755",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
worship-worker = "worship_worker:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
